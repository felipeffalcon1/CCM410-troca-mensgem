services:
  referencia:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.referencia
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5556:5556"

  proxy:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.proxy
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5557:5557"
      - "5558:5558"

  server:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.server
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "5555"
    volumes:
      - ./data:/app/data
    depends_on:
      - proxy
      - referencia

  bot1:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.bot
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - server
      - proxy

  bot2:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.bot
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - server
      - proxy
