version: '3.8'

services:
  proxy:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.proxy
    ports:
      - "5557:5557"
      - "5558:5558"

  server:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.server
    ports:
      - "5555:5555"
    volumes:
      - ./data:/app/data
    depends_on:
      - proxy

  bot1:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.bot
    depends_on:
      - server
      - proxy

  bot2:
    build: 
      context: ./python-app
      dockerfile: Dockerfile.bot
    depends_on:
      - server
      - proxy
